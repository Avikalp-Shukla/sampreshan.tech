    <path d="M8 36 Q10 48 24 51 Q30 52.5 32 50 Q34 52.5 40 51 Q54 48 56 36 Q48 42 40 41 Q36 40.5 32 42 Q28 40.5 24 41 Q16 42 8 36 Z" fill="url(#sevHand)"/>
