      <stop offset="100%" stop-color="#FF9933"/>
    </radialGradient>
    <radialGradient id="sevGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD9A8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFD9A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sevShadow" x="-20%" y="-10%" width="140%" height="140%">
