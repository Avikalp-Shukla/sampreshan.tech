      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#E0851A"/>
    </linearGradient>
    <radialGradient id="sevFlame" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF"/>
