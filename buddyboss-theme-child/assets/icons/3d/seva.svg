    <path d="M32 34 C29.5 30.5, 29.5 27, 32 23.5 C34.5 27, 34.5 30.5, 32 34 Z" fill="url(#sevFlame)"/>
    <ellipse cx="32" cy="29" rx="1.1" ry="2.6" fill="#FFFFFF" opacity="0.7"/>
    <path d="M24 33 Q32 30 40 33" stroke="#B33A3A" stroke-width="1.4" fill="none" opacity="0.55" stroke-linecap="round"/>
