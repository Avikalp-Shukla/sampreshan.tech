<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Share">
  <defs>
    <radialGradient id="shareNode" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#E0851A"/>
    </radialGradient>
    <linearGradient id="shareLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="shareShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dy="1.4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="32" cy="58" rx="14" ry="2" fill="#1A3380" opacity="0.18"/>
  <g filter="url(#shareShadow)">
    <line x1="46" y1="14" x2="20" y2="32" stroke="url(#shareLine)" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="50" x2="20" y2="32" stroke="url(#shareLine)" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="14" x2="46" y2="50" stroke="url(#shareLine)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="46" cy="14" r="7" fill="url(#shareNode)"/>
    <circle cx="46" cy="50" r="7" fill="url(#shareNode)"/>
    <circle cx="20" cy="32" r="8" fill="url(#shareNode)"/>
    <circle cx="44" cy="12" r="1.6" fill="#FFF8F0" opacity="0.85"/>
    <circle cx="44" cy="48" r="1.6" fill="#FFF8F0" opacity="0.85"/>
    <circle cx="18" cy="30" r="1.8" fill="#FFF8F0" opacity="0.9"/>
  </g>
