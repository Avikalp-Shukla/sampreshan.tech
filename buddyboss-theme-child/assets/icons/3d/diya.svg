      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="32" cy="58" rx="16" ry="2" fill="#1A3380" opacity="0.18"/>
  <g filter="url(#diyaShadow)">
    <circle cx="32" cy="30" r="20" fill="url(#diyaGlow)"/>
    <path d="M10 38 C10 34, 16 32, 32 32 C48 32, 54 34, 54 38 L50 46 C50 48, 48 50, 46 50 L18 50 C16 50, 14 48, 14 46 Z" fill="url(#diyaBowl)"/>
