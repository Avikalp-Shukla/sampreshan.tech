    <rect x="31" y="26" width="2" height="6" fill="#5C5C5C"/>
    <path d="M32 26 C29 22, 29 18, 32 14 C35 18, 35 22, 32 26 Z" fill="url(#diyaFlame)"/>
    <ellipse cx="32" cy="20" rx="1.2" ry="3" fill="#FFFFFF" opacity="0.7"/>
