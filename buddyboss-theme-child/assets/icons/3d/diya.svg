<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Diya Lamp">
  <defs>
    <radialGradient id="diyaFlame" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </radialGradient>
    <radialGradient id="diyaGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD9A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diyaOil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9B9D5"/>
      <stop offset="100%" stop-color="#0A1A3D"/>
    </linearGradient>
    <linearGradient id="diyaBowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB877"/>
      <stop offset="100%" stop-color="#9A4F0B"/>
    </linearGradient>
    <filter id="diyaShadow" x="-20%" y="-10%" width="140%" height="140%">
