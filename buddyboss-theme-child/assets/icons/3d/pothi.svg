<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pothi — Cultural Heritage manuscript">
  <defs>
    <linearGradient id="pthLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#EFE3CB"/>
    </linearGradient>
    <linearGradient id="pthCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B33A3A"/>
      <stop offset="100%" stop-color="#6E1423"/>
    </linearGradient>
    <linearGradient id="pthThread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E04E00"/>
      <stop offset="100%" stop-color="#9A1B1E"/>
    </linearGradient>
    <radialGradient id="pthGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F5C542" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F5C542" stop-opacity="0"/>
    </radialGradient>
    <filter id="pthShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="32" cy="58" rx="17" ry="2" fill="#1A3380" opacity="0.18"/>
  <g filter="url(#pthShadow)">
    <circle cx="32" cy="34" r="19" fill="url(#pthGlow)"/>
    <rect x="9" y="40" width="46" height="7.5" rx="3.75" fill="#E2D3B3"/>
    <rect x="11" y="32" width="42" height="7.5" rx="3.75" fill="url(#pthLeaf)"/>
    <line x1="16" y1="35.5" x2="48" y2="35.5" stroke="#8A6D3B" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <line x1="16" y1="38.5" x2="42" y2="38.5" stroke="#8A6D3B" stroke-width="1.1" stroke-linecap="round" opacity="0.45"/>
    <rect x="9" y="21" width="46" height="9" rx="3" fill="url(#pthCover)"/>
    <rect x="9" y="21" width="46" height="3" rx="1.5" fill="#D4A017" opacity="0.85"/>
    <circle cx="15" cy="25.5" r="1.4" fill="#F5C542"/>
    <circle cx="49" cy="25.5" r="1.4" fill="#F5C542"/>
    <rect x="29.5" y="21" width="5" height="26.5" fill="url(#pthThread)"/>
    <circle cx="32" cy="47.5" r="2.6" fill="none" stroke="#9A1B1E" stroke-width="1.6"/>
  </g>
