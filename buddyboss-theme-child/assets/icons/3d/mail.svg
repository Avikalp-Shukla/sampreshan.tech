      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F0E8"/>
    </linearGradient>
    <linearGradient id="mailFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB877"/>
      <stop offset="100%" stop-color="#E0851A"/>
    </linearGradient>
    <linearGradient id="mailSeal" x1="0" y1="0" x2="0" y2="1">
