<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sampreshan Dharma Mark">
  <defs>
    <radialGradient id="dharmaLotus" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="60%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </radialGradient>
    <linearGradient id="dharmaPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </linearGradient>
    <linearGradient id="dharmaCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#E0851A"/>
    </linearGradient>
    <filter id="dharmaShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="32" cy="58" rx="14" ry="2" fill="#1A3380" opacity="0.18"/>
  <g filter="url(#dharmaShadow)" transform="translate(32 30)">
    <g id="petals">
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9"/>
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9" transform="rotate(45)"/>
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9" transform="rotate(90)"/>
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9" transform="rotate(135)"/>
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9" transform="rotate(225)"/>
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9" transform="rotate(270)"/>
      <ellipse cx="0" cy="-16" rx="5" ry="14" fill="url(#dharmaPetal)" opacity="0.9" transform="rotate(315)"/>
    </g>
    <circle r="9" fill="url(#dharmaLotus)"/>
    <circle r="5" fill="url(#dharmaCenter)"/>
    <circle r="2" fill="#7A4810"/>
    <path d="M0 -22 L-2 -28 L0 -30 L2 -28 Z" fill="#9A4F0B"/>
  </g>
</svg>
