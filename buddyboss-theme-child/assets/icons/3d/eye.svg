      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E2D5"/>
    </radialGradient>
    <radialGradient id="eyeIris" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#A9B9D5"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A1A3D"/>
