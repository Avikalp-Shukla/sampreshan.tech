<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lotus">
  <defs>
    <linearGradient id="lotusPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </linearGradient>
    <radialGradient id="lotusCenter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <filter id="lotusShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="32" cy="58" rx="16" ry="2" fill="#1A3380" opacity="0.18"/>
  <g filter="url(#lotusShadow)" transform="translate(32 34)">
    <ellipse cx="0" cy="-6" rx="6" ry="16" fill="url(#lotusPetal)" opacity="0.85" transform="rotate(-50)"/>
    <ellipse cx="0" cy="-6" rx="6" ry="16" fill="url(#lotusPetal)" opacity="0.85" transform="rotate(50)"/>
    <ellipse cx="0" cy="-6" rx="6" ry="16" fill="url(#lotusPetal)" opacity="0.9" transform="rotate(-25)"/>
    <ellipse cx="0" cy="-6" rx="6" ry="16" fill="url(#lotusPetal)" opacity="0.9" transform="rotate(25)"/>
    <ellipse cx="0" cy="-4" rx="5" ry="14" fill="url(#lotusPetal)" opacity="0.95"/>
    <circle r="5" fill="url(#lotusCenter)"/>
    <circle r="1.6" fill="#9A4F0B"/>
  </g>
</svg>
