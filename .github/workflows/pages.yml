name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'demo.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static demo artifact
        run: |
          rm -rf site
          mkdir -p site
          copied=0
          [ -f index.html ] && cp index.html site/ && copied=1
          [ -f demo.html ] && cp demo.html site/ && copied=1
          [ -f preview.html ] && cp preview.html site/ && copied=1
          if [ "$copied" -eq 0 ]; then
            echo "No static demo files found to publish."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
