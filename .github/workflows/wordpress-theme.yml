name: Validate and deploy WordPress child theme

on:
  push:
    branches: [main]
    paths:
      - 'buddyboss-theme-child/**'
      - '.github/workflows/wordpress-theme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-theme-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find buddyboss-theme-child -type f -name '*.php' -not -path '*/vendor/*' -print0)

      - name: Check whitespace
        run: git diff --check

      - name: Build theme archive
        run: |
          mkdir -p build
          zip -qr build/sampreshan-child-${GITHUB_SHA::12}.zip buddyboss-theme-child \
            -x '*/.DS_Store' '*/node_modules/*'

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: sampreshan-child-theme
          path: build/*.zip
          if-no-files-found: error

  deploy:
    name: Deploy theme over SFTP
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sampreshan.tech
    env:
      WP_DEPLOY_HOST: ${{ secrets.WP_DEPLOY_HOST }}
      WP_DEPLOY_PORT: ${{ secrets.WP_DEPLOY_PORT }}
      WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
      WP_DEPLOY_KEY: ${{ secrets.WP_DEPLOY_KEY }}
      WP_DEPLOY_TARGET: ${{ secrets.WP_DEPLOY_TARGET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$WP_DEPLOY_HOST" && -n "$WP_DEPLOY_USER" && -n "$WP_DEPLOY_KEY" && -n "$WP_DEPLOY_TARGET" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Production deploy skipped: WP_DEPLOY_* secrets are not configured.'
          fi

      - name: Deploy child theme
        if: steps.config.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.WP_DEPLOY_HOST }}
          port: ${{ env.WP_DEPLOY_PORT || 22 }}
          username: ${{ env.WP_DEPLOY_USER }}
          key: ${{ env.WP_DEPLOY_KEY }}
          source: buddyboss-theme-child
          target: ${{ env.WP_DEPLOY_TARGET }}
          overwrite: true
          rm: false

      - name: Smoke test live homepage
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 https://sampreshan.tech/ >/tmp/sampreshan-home.html
          grep -q 'sampreshan-child' /tmp/sampreshan-home.html
