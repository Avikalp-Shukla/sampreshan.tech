<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SampreShan — Preview</title>

    <!-- Pre-render setup -->
    <script>
        window.APP_CONFIG = {
            apiUrl: 'http://localhost:8000',
            siteName: 'SampreShan',
            tagline: 'Join the Sanatan Sampreshan',
            theme: 'premium-religious',
            previewMode: true
        };
        document.documentElement.dataset.theme = 'premium-religious';
    </script>

    <!-- Design System -->
    <link rel="stylesheet" href="https://sampreshan.tech/wp-content/themes/buddyboss-theme-child/assets/css/design-system.css" />
    <link rel="stylesheet" href="https://sampreshan.tech/wp-content/themes/buddyboss-theme-child/assets/css/layout.css" />
    <link rel="stylesheet" href="https://sampreshan.tech/wp-content/themes/buddyboss-theme-child/assets/css/components.css" />
    <link rel="stylesheet" href="https://sampreshan.tech/wp-content/themes/buddyboss-theme-child/assets/css/responsive.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Tiro+Devanagari:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        /* Preview wrapper */
        .preview-wrapper {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0;
            background: #FAF8F4;
            min-height: 100vh;
        }
        .preview-banner {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: linear-gradient(90deg, #FF9933, #1E3A8A);
            color: #fff;
            padding: 10px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-align: center;
            box-shadow: 0 2px 12px rgba(30,58,138,0.2);
        }
        .preview-banner a { color: #FFE4B3; text-decoration: underline; }
        .preview-banner a:hover { color: #fff; }
        .preview-iframe {
            width: 100%;
            height: calc(100vh - 42px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="preview-banner">
        &#128640; PREVIEW MODE &mdash; SampreShan Child Theme (Premium Design System) &mdash; <a href="https://sampreshan.tech/" target="_blank">Open Live Site</a> &mdash; <a href="https://avikalp-shukla.github.io/sampreshan.tech/" target="_blank">GitHub Pages</a>
    </div>

    <div class="preview-wrapper">
        <iframe class="preview-iframe" src="https://sampreshan.tech/" title="SampreShan Live Preview" allow="fullscreen; autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script>
        // Preview interaction
        const banner = document.querySelector('.preview-banner');
        const iframe = document.querySelector('.preview-iframe');

        // Log config for debugging
        console.log('[Preview] APP_CONFIG:', window.APP_CONFIG);
        console.log('[Preview] Theme:', window.APP_CONFIG.theme);
        console.log('[Preview] Fonts:', window.APP_CONFIG.fonts);
    </script>

</body>
</html>
